[tox]
skipsdist = true
envlist = py310, py311, py312

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv:py310]
passenv = PYTHON_VERSION
allowlist_externals = uv,pytest,pyright
commands =
    uv python pin 3.10
    uv run pytest

[testenv:py311]
passenv = PYTHON_VERSION
allowlist_externals = uv,pytest,pyright
commands =
    uv python pin 3.11
    uv run pytest

[testenv:py312]
passenv = PYTHON_VERSION
allowlist_externals = uv,pytest,pyright
commands =
    uv python pin 3.12
    uv run pytest

[testenv:py313]
passenv = PYTHON_VERSION
allowlist_externals = uv,pytest,pyright
commands =
    uv python pin 3.13
    uv run pytest
