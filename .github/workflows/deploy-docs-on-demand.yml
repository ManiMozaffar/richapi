name: Deploy Docs On Demand

on:
  workflow_dispatch:

jobs:
  deploy-docs-on-demand:
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike commits on top of the existing gh-pages branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: uv sync --frozen

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for the current version as latest
        run: uv run python deploy_docs.py
